<style>
/* Mise en page : plein écran façon console. Le jeu occupe tout l'écran ; en portrait tactile, les commandes sont sous l'image ; en paysage, elles flottent sur les côtés. Univers sombre assumé (un seul thème). */
:root{
  --night:#0c0e1f; --pad:#171a35; --pad-hi:#2e3466; --pad-lo:#0a0c1f;
  --ink:#ebe8f7; --muted:#9a9dc8; --amber:#f2b134; --amber-lo:#b97d12; --amber-ink:#5a3906;
  --box:#fbf8ef; --box-ink:#262338; --line:#3a3f78; --line2:#a4abe4; --panel:#e6e9f8;
  --hp-hi:#3cc46a; --hp-mid:#f0b429; --hp-lo:#e8483f; --xp:#4aa8f0;
  --ui:'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --label:'Silkscreen', 'Pixelify Sans', ui-monospace, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:relative;height:100%;width:100%;overflow:hidden;display:flex;flex-direction:column;background:#000}
#screen{position:relative;width:100%;height:100%;flex:none;overflow:hidden;background:#000;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#stage,#ui{position:absolute;top:0;left:0;width:100%;pointer-events:none;container-type:inline-size;font-family:var(--ui);color:var(--box-ink);font-variant-numeric:tabular-nums}
#ui{height:100%;font-size:17px;line-height:1.28;z-index:20}
#stage{height:100%;z-index:10}
#hud{position:absolute;inset:0}
#hud>*,#ui>*{pointer-events:auto}
#fade{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none;z-index:80}
#banner{position:absolute;left:2cqw;top:2cqw;z-index:70;padding:1.2cqw 3.4cqw;font-size:3.8cqw;color:var(--box-ink);font-family:var(--ui);opacity:0;transform:translateY(-130%);transition:transform .35s ease,opacity .35s ease;pointer-events:none!important}
#banner.on{transform:none;opacity:1}
/* Commandes tactiles */
#controls{display:none;touch-action:none}
#app[data-mode="port"] #controls{display:grid;grid-template-columns:auto 1fr auto;align-items:center;flex:1;padding:8px max(18px, env(safe-area-inset-right, 0px)) 10px max(18px, env(safe-area-inset-left, 0px));background:radial-gradient(120% 90% at 50% 0%,#1b1f42 0%,var(--night) 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.04)}
#app[data-mode="land"] #controls{display:block;position:absolute;inset:0;pointer-events:none;z-index:60}
#app[data-mode="land"] .dpad,#app[data-mode="land"] .joy{position:absolute;left:max(12px, env(safe-area-inset-left, 0px));bottom:16px;pointer-events:auto;opacity:.62;transform:scale(var(--cs,1));transform-origin:left bottom}
#app[data-mode="land"] .ab{position:absolute;right:max(12px, env(safe-area-inset-right, 0px));bottom:10px;pointer-events:auto;opacity:.72;transform:scale(var(--cs,1));transform-origin:right bottom}
#app[data-mode="land"] .mid{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));top:14px;pointer-events:auto;opacity:.8}
.dpad{position:relative;width:128px;height:128px;touch-action:none;cursor:pointer}
#app[data-pad="joy"] .dpad,#app[data-pad="dpad"] .joy{display:none}
.joy{position:relative;width:140px;height:140px;border-radius:50%;touch-action:none;cursor:pointer;background:radial-gradient(circle at 50% 45%,#1f2450 0%,var(--pad) 62%,#11142b 100%);box-shadow:inset 0 0 0 2px var(--pad-hi),inset 0 10px 22px rgba(0,0,0,.45),0 4px 0 var(--pad-lo)}
.joy::before{content:'';position:absolute;inset:22%;border-radius:50%;border:2px dashed rgba(154,157,200,.18)}
.joy .tk{position:absolute;width:0;height:0;border:6px solid transparent;transition:border-color .08s}
.joy .tk.u{left:calc(50% - 6px);top:7px;border-bottom-color:var(--muted)} .joy .tk.d{left:calc(50% - 6px);bottom:7px;border-top-color:var(--muted)}
.joy .tk.l{top:calc(50% - 6px);left:7px;border-right-color:var(--muted)} .joy .tk.r{top:calc(50% - 6px);right:7px;border-left-color:var(--muted)}
.joy[data-d="up"] .tk.u{border-bottom-color:var(--amber)} .joy[data-d="down"] .tk.d{border-top-color:var(--amber)}
.joy[data-d="left"] .tk.l{border-right-color:var(--amber)} .joy[data-d="right"] .tk.r{border-left-color:var(--amber)}
.joy-knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#5a63a8,#2f366e 55%,#1d2247);box-shadow:inset 0 0 0 2px #6a73b8,0 6px 10px rgba(0,0,0,.45);transition:transform .12s ease-out;will-change:transform}
.joy.on .joy-knob{transition:none;box-shadow:inset 0 0 0 2px var(--amber),0 6px 10px rgba(0,0,0,.45)}
.dpad::before,.dpad::after{content:'';position:absolute;background:var(--pad);border-radius:7px;box-shadow:0 4px 0 var(--pad-lo),inset 0 1px 0 var(--pad-hi)}
.dpad::before{left:42px;top:0;width:44px;height:128px}
.dpad::after{left:0;top:42px;width:128px;height:44px}
.dpad .hub{position:absolute;left:54px;top:54px;width:20px;height:20px;border-radius:50%;background:#0e1026;z-index:2}
.dpad .ar{position:absolute;z-index:2;width:0;height:0;border:7px solid transparent;transition:border-color .08s}
.ar.u{left:57px;top:8px;border-bottom-color:var(--muted)} .ar.d{left:57px;bottom:8px;border-top-color:var(--muted)}
.ar.l{top:57px;left:8px;border-right-color:var(--muted)} .ar.r{top:57px;right:8px;border-left-color:var(--muted)}
.dpad[data-d="up"] .ar.u{border-bottom-color:var(--amber)} .dpad[data-d="down"] .ar.d{border-top-color:var(--amber)}
.dpad[data-d="left"] .ar.l{border-right-color:var(--amber)} .dpad[data-d="right"] .ar.r{border-left-color:var(--amber)}
.mid{display:flex;flex-direction:column;align-items:center;gap:5px;justify-self:center}
.pill{width:58px;height:18px;border-radius:9px;border:0;background:var(--pad);box-shadow:inset 0 1px 0 var(--pad-hi),0 3px 0 var(--pad-lo);cursor:pointer}
.pill.on{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--pad-hi),0 1px 0 var(--pad-lo)}
.mid span{font-family:var(--label);font-size:9px;letter-spacing:.14em;color:var(--muted)}
.ab{position:relative;width:136px;height:126px}
.btn-r{position:absolute;width:62px;height:62px;border-radius:50%;border:0;background:radial-gradient(circle at 34% 30%,#ffd98a,var(--amber) 55%,var(--amber-lo));box-shadow:0 5px 0 #6e4a08,0 10px 16px rgba(0,0,0,.35);font-family:var(--label);font-size:17px;color:var(--amber-ink);cursor:pointer;touch-action:none}
.btn-r.a{right:2px;top:4px} .btn-r.b{left:2px;bottom:10px}
.btn-r.on{transform:translateY(4px);box-shadow:0 1px 0 #6e4a08,0 4px 8px rgba(0,0,0,.3)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.khint{display:none;position:absolute;bottom:2cqw;left:0;right:0;text-align:center;font-family:var(--label);font-size:2.4cqw;letter-spacing:.06em;color:#c8c8f0;text-shadow:0 .3cqw 0 #0c0e1f}
#app[data-mode="desk"] .khint{display:block}
.pickcard{position:absolute;left:1.6cqw;right:1.6cqw;top:3cqw;z-index:44;display:flex;gap:3cqw;align-items:center;padding:2cqw 3cqw}
.pickcard img{width:24cqw;height:24cqw;image-rendering:pixelated;flex:none}
.pickcard b{font-size:4.6cqw}
.pickcard p{margin:1.2cqw 0 0;font-size:3.3cqw;line-height:1.3}
/* Boîtes de jeu (à l'intérieur de l'écran, en unités relatives à l'écran) */
.box{background:var(--box);border:.7cqw solid var(--line);border-radius:1.8cqw;box-shadow:inset 0 0 0 .5cqw var(--box),inset 0 0 0 .85cqw var(--line2),0 .6cqw 0 rgba(10,8,30,.35)}
.dlg{position:absolute;left:1.6cqw;right:1.6cqw;bottom:1.6cqw;height:18.5cqw;padding:2.6cqw 3.6cqw;z-index:40;box-sizing:border-box;cursor:pointer;overflow:hidden}
.dlg.narrow{right:calc(50% + .4cqw);font-size:3.9cqw;padding-right:2.4cqw}
.dtx{white-space:pre-line}
.dnext{position:absolute;right:3cqw;bottom:1.6cqw;font-size:3cqw;color:var(--hp-lo);animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(.6cqw)}}
.menu{position:absolute;z-index:45;padding:1.6cqw 7cqw 1.6cqw 1.4cqw;box-sizing:border-box}
.menu-ask,.menu-mini{right:1.6cqw;bottom:21.5cqw;min-width:32cqw}
.menu-mini.wide{min-width:56cqw}
.menu-mini.wide .it{justify-content:space-between}
.menu-mini.wide small{font-size:2.8cqw;opacity:.7}
.menu-main{right:1.6cqw;top:1.6cqw;min-width:38cqw}
.bmenu{right:1.6cqw;bottom:1.6cqw;width:calc(50% - 2cqw);height:18.5cqw;display:grid;grid-template-columns:1fr 1fr;align-content:center;padding:1.4cqw;font-size:3.9cqw}
.bmenu .it{padding-left:3.8cqw;white-space:nowrap;overflow:hidden}
.mvmenu{left:1.6cqw;right:1.6cqw;bottom:1.6cqw;min-height:18.5cqw;display:grid;grid-template-columns:1fr 1fr;gap:.2cqw 1cqw;align-content:center;padding-top:1.2cqw;padding-bottom:1.2cqw}
.it{position:relative;padding:.7cqw 1.4cqw .7cqw 4.6cqw;border-radius:1cqw;cursor:pointer;display:flex;align-items:center;gap:1.4cqw;min-width:0}
.it.sel{background:rgba(58,63,120,.1)}
.it.sel::before{content:'';position:absolute;left:1.3cqw;top:50%;transform:translateY(-50%);border-top:1.3cqw solid transparent;border-bottom:1.3cqw solid transparent;border-left:1.7cqw solid var(--box-ink)}
.it.dis{opacity:.42}
.it small{display:block}
.xbtn{position:absolute;top:1cqw;right:1cqw;width:5.4cqw;height:5.4cqw;border-radius:50%;border:0;background:var(--line);color:#fff;font-family:var(--ui);font-size:2.8cqw;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.mv{flex-direction:column;align-items:flex-start;gap:.1cqw;padding:.4cqw 1cqw .4cqw 4.4cqw;line-height:1.15}
.mv b{font-size:3.4cqw;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---------- Apprentissage des capacités ---------- */
const LS_CACHE = {};
function learnset(id) {
  if (LS_CACHE[id]) return LS_CACHE[id];
  const sp = SP[id], [t1, t2] = sp.types, T1 = TIER[t1], T2 = t2 ? TIER[t2] : null;
  const base = ['quad', 'biped'].includes(sp.plan) ? 'griffe' : 'charge';
  const n1 = ['quad', 'golem', 'biped'].includes(sp.plan) ? 'regard' : 'grondement';
  const raw = [[1, base], [1, n1], [5, T1[0]], [9, T2 ? T2[0] : 'vive'], [13, T1[1]], [17, STATUS[t1]], [21, T2 ? T2[1] : 'coupdetete'],
    [26, T1[2]], [30, T2 ? STATUS[t2] : 'affutage'], [34, T2 ? T2[2] : 'plaquage'], [39, 'recup'], [44, T1[3]], [50, T2 ? T2[3] : 'deferlante']];
  raw.sort((a, b) => a[0] - b[0]);
  const seen = new Set(), out = [];
  for (const [l, m] of raw) { if (!MOVES[m] || seen.has(m)) continue; seen.add(m); out.push([l, m]); }
  return (LS_CACHE[id] = out);
}
function movesAt(id, lvl) {
  const ids = learnset(id).filter(x => x[0] <= lvl).map(x => x[1]);
  const atk = ids.filter(m => MOVES[m].cat !== 'stat'), st = ids.filter(m => MOVES[m].cat === 'stat');
  const chosen = new Set(atk.slice(-3));
  if (st.length) chosen.add(st[st.length - 1]);
  for (let i = ids.length - 1; i >= 0 && chosen.size < 4; i--) chosen.add(ids[i]);
  return ids.filter(m => chosen.has(m));
}

/* ---------- Statistiques ---------- */
let UID = 1;
const SK = { hp: 0, atk: 1, def: 2, spd: 3 };
function stat(m, k) { const b = SP[m.sp].base[SK[k]]; const v = Math.floor((2 * b + m.iv[k]) * m.lvl / 100); return k === 'hp' ? v + m.lvl + 10 : v + 5; }
const maxHP = m => stat(m, 'hp');
const xpFor = l => l <= 1 ? 0 : l * l * l;
function makeMon(id, lvl) {
  const m = { uid: UID++, sp: id, lvl, xp: xpFor(lvl), iv: { hp: randInt(0, 15), atk: randInt(0, 15), def: randInt(0, 15), spd: randInt(0, 15) }, status: null, sleep: 0, moves: [] };
  m.moves = movesAt(id, lvl).map(mid => ({ id: mid, pp: MOVES[mid].pp }));
  m.hp = maxHP(m);
  return m;
}
function healMon(m) { m.hp = maxHP(m); m.status = null; m.sleep = 0; m.moves.forEach(x => x.pp = MOVES[x.id].pp); }

const UI = { root: null, dlg: null };
function dlgEl() {
  if (!UI.dlg) {
    UI.dlg = el('div', 'dlg box', '<div class="dtx"></div><div class="dnext" hidden>▼</div>');
    UI.dlg.addEventListener('pointerdown', e => { e.preventDefault(); Input.press('a'); });
    UI.root.appendChild(UI.dlg);
  }
  UI.dlg.hidden = false; return UI.dlg;
}
function hideDlg() { if (UI.dlg) UI.dlg.hidden = true; }
function say(text, opt = {}) {
  const d = dlgEl(), tx = d.querySelector('.dtx'), nx = d.querySelector('.dnext');
  d.classList.toggle('narrow', !!opt.narrow);
  nx.hidden = true; UI.root.appendChild(d);
  const speed = [34, 16, 4][SET.speed];
  return new Promise(res => {
    let i = 0, closed = false, typing = true, tm = null;
    const h = { key(k) { if (k !== 'a' && k !== 'b') return; if (typing) { i = text.length; } else done(); } };
    Input.push(h);
    const done = () => { if (closed) return; closed = true; clearTimeout(tm); Input.pop(h); nx.hidden = true; if (!opt.keep) SND.sfx('blip'); res(); };
    const step = () => {
      if (closed) return;
      i = Math.min(text.length, i + (speed < 6 ? 3 : 1)); tx.textContent = text.slice(0, i);
      if (i < text.length) { tm = setTimeout(step, speed); return; }
      typing = false;
      if (opt.noWait) { closed = true; Input.pop(h); res(); }
      else if (opt.auto != null) { tm = setTimeout(done, opt.auto + [500, 250, 120][SET.speed]); }
      else nx.hidden = false;
    };
    step();
  });
}
function navigate(box, o = {}) {
  const cols = o.cols || 1, cancel = o.cancel !== false;
  return new Promise(res => {
    const items = [...box.querySelectorAll('.it')];
    if (!items.length) { const h = { key(k) { if (k === 'a' || k === 'b') { Input.pop(h); res(-1); } } }; Input.push(h); return; }
    let i = clamp(o.start || 0, 0, items.length - 1), closed = false;
    const set = n => { items[i] && items[i].classList.remove('sel'); i = n; items[i].classList.add('sel'); items[i].scrollIntoView({ block: 'nearest' }); o.onMove && o.onMove(i); };
    const done = v => { if (closed) return; closed = true; Input.pop(h); items.forEach(it => it.onclick = null); SND.sfx(v < 0 ? 'back' : 'select'); res(v); };
    const h = { key(k) {
      const n = items.length;
      if (k === 'up') { if (cols === 1) set((i - 1 + n) % n); else if (i - cols >= 0) set(i - cols); }
      else if (k === 'down') { if (cols === 1) set((i + 1) % n); else if (i + cols < n) set(i + cols); }
      else if (k === 'left') { if (cols > 1 && i % cols > 0) set(i - 1); else if (o.onLR) o.onLR(-1); }
      else if (k === 'right') { if (cols > 1 && i % cols < cols - 1 && i + 1 < n) set(i + 1); else if (o.onLR) o.onLR(1); }
      else if (k === 'a') { if (items[i].classList.contains('dis')) { SND.sfx('bump'); return; } done(i); }
      else if (k === 'b' && cancel) done(-1);
    } };
    items.forEach((it, n) => it.onclick = e => { e.stopPropagation(); if (closed) return; if (it.classList.contains('dis')) { SND.sfx('bump'); return; } set(n); done(n); });
    Input.push(h); set(i);
  });
}
async function choose(opts, o = {}) {
  const box = el('div', 'menu box ' + (o.cls || 'menu-ask'));
  box.innerHTML = opts.map(op => { const L = typeof op === 'string' ? { label: op } : op; return `<div class="it${L.dis ? ' dis' : ''}">${L.html || esc(L.label)}</div>`; }).join('');
  if (o.cancel !== false) { const x = el('button', 'xbtn', '✕'); x.setAttribute('aria-label', 'Fermer'); x.onclick = e => { e.stopPropagation(); Input.press('b'); }; box.appendChild(x); }
  UI.root.appendChild(box);

}

async function playerAction(B) {

/* ---------- Effets visuels ---------- */
function spawnFX(type, x, y) {
  const c = TYPES[type] ? TYPES[type].c : '#ffffff', L = shade(c, .45), W = '#ffffff';
  const add = o => FX.push(Object.assign({ x, y, vx: 0, vy: 0, g: 0, life: .6, age: 0, sz: 3, col: c }, o));
  switch (type) {
    case 'Feu': for (let i = 0; i < 18; i++) add({ x: x + rr(-14, 14), y: y + rr(0, 14), vx: rr(-20, 20), vy: rr(-80, -30), life: rr(.4, .8), col: pick(['#ff5a2a', '#ffae2e', '#fff09a']), sz: rr(2, 4) | 0 }); break;
    case 'Eau': for (let i = 0; i < 16; i++) { const a = Math.random() * Math.PI * 2, s = rr(40, 90); add({ vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, g: 160, col: pick([c, L, W]), sz: rr(2, 4) | 0 }); } break;
    case 'Plante': for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; add({ x: x + Math.cos(a) * 24, y: y + Math.sin(a) * 15, vx: -Math.cos(a) * 42, vy: -Math.sin(a) * 30, col: pick(['#56c44a', '#8fe070', '#3f8f3a']), sz: 3, life: .55 }); } break;
    case 'Foudre': for (let i = 0; i < 4; i++) add({ bolt: true, x: x + rr(-16, 16), y: y - 26, life: .32, col: pick(['#fff4a0', '#f4d23c']) }); break;
    case 'Pierre': for (let i = 0; i < 10; i++) add({ x: x + rr(-20, 20), y: y - rr(30, 50), vy: rr(40, 80), g: 300, col: pick(['#b0955a', '#8a7550', '#d2b98a']), sz: rr(3, 6) | 0, life: .55 }); break;
    case 'Air': for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; add({ x: x + Math.cos(a) * 6, y: y + Math.sin(a) * 6, vx: Math.cos(a + 1.4) * 70, vy: Math.sin(a + 1.4) * 50, col: pick([W, L]), sz: 2 }); } break;
    case 'Glace': for (let i = 0; i < 14; i++) { const a = Math.random() * Math.PI * 2, s = rr(30, 80); add({ vx: Math.cos(a) * s, vy: Math.sin(a) * s, col: pick(['#c8f0ff', '#ffffff', c]), sz: rr(2, 4) | 0 }); } break;
    case 'Ombre': for (let i = 0; i < 3; i++) add({ ring: true, r: 4 + i * 6, vr: 50, col: pick(['#2a1a4a', '#6a5a8c']), life: .5 }); break;
    case 'Psy': for (let i = 0; i < 4; i++) add({ ring: true, r: 2 + i * 5, vr: 60, col: pick(['#ff8ac0', '#e8689a', '#ffffff']), life: .55 }); break;
    case 'Poison': for (let i = 0; i < 12; i++) add({ x: x + rr(-14, 14), y: y + rr(0, 12), vy: rr(-50, -20), col: pick(['#a055bd', '#c88aff', '#b8f05a']), sz: rr(2, 5) | 0, life: rr(.4, .7) }); break;
    case 'Dragon': for (let i = 0; i < 16; i++) add({ x: x + rr(-14, 14), y: y + rr(0, 10), vx: rr(-30, 30), vy: rr(-70, -30), col: pick(['#6656dc', '#9a8aff', '#f2c040']), sz: rr(2, 4) | 0 }); break;
    default: add({ star: true, life: .35, col: W }); for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; add({ vx: Math.cos(a) * 70, vy: Math.sin(a) * 70, col: W, sz: 2, life: .3 }); }
  }
}
function spawnStat(side, up) { const [x, y] = POS[side]; for (let i = 0; i < 12; i++) FX.push({ x: x + rr(-20, 20), y: y + rr(-10, 22), vx: 0, vy: up ? rr(-60, -30) : rr(30, 60), g: 0, life: .6, age: 0, sz: 2, col: up ? pick(['#7cc4ff', '#ffffff']) : pick(['#ff7a7a', '#a0a0b0']) }); }
function updateFX(dt) { const s = dt / 1000; for (let i = FX.length - 1; i >= 0; i--) { const p = FX[i]; p.age += s; if (p.age >= p.life) { FX.splice(i, 1); continue; } p.vy += p.g * s; p.x += p.vx * s; p.y += p.vy * s; if (p.ring) p.r += p.vr * s; } }
function drawFX() {
  for (const p of FX) {
    const a = 1 - p.age / p.life; ctx.globalAlpha = Math.max(0, a);
    if (p.ring) { ctx.strokeStyle = p.col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke(); }
    else if (p.bolt) { ctx.strokeStyle = p.col; ctx.lineWidth = 2; ctx.beginPath(); let x = p.x, y = p.y; ctx.moveTo(x, y); for (let k = 0; k < 6; k++) { x += (Math.random() - .5) * 14; y += 9; ctx.lineTo(x, y); } ctx.stroke(); }
    else if (p.star) { const r = 6 + 12 * (1 - a); ctx.fillStyle = p.col; ctx.beginPath(); for (let k = 0; k < 10; k++) { const ang = k * Math.PI / 5, rad = k % 2 ? r * .45 : r; ctx.lineTo(p.x + Math.cos(ang) * rad, p.y + Math.sin(ang) * rad); } ctx.closePath(); ctx.fill(); }
    else { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz); }
  }
  ctx.globalAlpha = 1;
}
function drawMonS(o, bx, by) { if (!o.vis || !o.img || o.scale <= .02) return; const s = o.scale, w = Math.round(64 * s), dx = Math.round(bx - 32 * s + o.x), dy = Math.round(by - 61 * s + o.y); ctx.globalAlpha = o.alpha; ctx.drawImage(o.white ? o.wimg : o.img, dx, dy, w, w); ctx.globalAlpha = 1; }
function drawTr(o, bx, by) { if (!o.vis || !o.img) return; ctx.drawImage(o.img, Math.round(bx - 32 + o.x), Math.round(by - 61 + o.y)); }
function renderBattle(now) {
  const B = BATTLE; if (!B) return; const S = B.S;
  if (B.bg.width !== LW || B.bg.height !== LH) B.bg = paintBattleBG();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, LW, LH);
  ctx.drawImage(B.bg, 0, 0); ctx.save(); ctx.translate(B.bg.ox, B.bg.oy);
  drawTr(S.foeTr, 176, 69); drawMonS(S.foe, 176, 69);
  drawTr(S.meTr, 64, 116);
  const bob = B.idle ? (Math.floor(now / 300) % 2) : 0;
  drawMonS(S.me, 64, 116 + bob);
  if (S.ball) { ctx.save(); ctx.translate(Math.round(S.ball.x), Math.round(S.ball.y)); ctx.rotate(S.ball.rot || 0); ctx.drawImage(capsuleImg(), -5, -5); ctx.restore(); }
  drawFX(); ctx.restore();
}

/* ---------- Mécanique ---------- */
function calcDamage(a, d, mv, sa, sd) {
  const A = stat(a, 'atk') * stMul(sa.atk) * (a.status === 'brul' ? .5 : 1), D = stat(d, 'def') * stMul(sd.def);
  const base = Math.floor(Math.floor((Math.floor(2 * a.lvl / 5) + 2) * mv.p * A / D) / 50) + 2;
  const stab = SP[a.sp].types.includes(mv.t) ? 1.5 : 1, eff = typeMult(mv.t, SP[d.sp].types);
  const crit = Math.random() < ((mv.fx && mv.fx.crit) ? .125 : .0625);
  const dmg = eff === 0 ? 0 : Math.max(1, Math.floor(base * stab * eff * (crit ? 1.5 : 1) * (.85 + Math.random() * .15)));
  return { dmg, eff, crit };
}
const speedOf = (B, side) => { const m = mon(B, side); return stat(m, 'spd') * stMul(B.st[side].spd) * (m.status === 'para' ? .5 : 1); };
function aiChoose(B) {
  const foe = foeMon(B), me = meMon(B);
  if (B.potions > 0 && foe.hp > 0 && foe.hp < maxHP(foe) * .28) return { k: 'potion' };
  const opts = foe.moves.map((m, i) => ({ i, id: m.id, pp: m.pp })).filter(o => o.pp > 0);
  if (!opts.length) return { k: 'move', id: 'lutte', idx: null };
  const smart = B.trainer ? (B.trainer.leader ? .88 : .6) : .3;
  if (Math.random() > smart) { const o = pick(opts); return { k: 'move', id: o.id, idx: o.i }; }
  let best = opts[0], bs = -1;
  for (const o of opts) {
    const mv = MOVES[o.id], fx = mv.fx || {}; let sc;
    if (mv.cat === 'stat') {
      if (fx.heal) sc = foe.hp < maxHP(foe) * .45 ? 90 : 0;
      else if (fx.self) sc = Object.keys(fx.self).some(k => B.st.foe[k] < 2) ? 32 : 4;
      else if (fx.foe) sc = Object.keys(fx.foe).some(k => B.st.me[k] > -2) ? 26 : 4;
      else sc = me.status ? 0 : 48;
    } else {
      const eff = typeMult(mv.t, SP[me.sp].types), stab = SP[foe.sp].types.includes(mv.t) ? 1.5 : 1;
      sc = mv.p * eff * stab * (mv.a || 100) / 100;
    }
    sc *= .85 + Math.random() * .3;
    if (sc > bs) { bs = sc; best = o; }
  }
  return { k: 'move', id: best.id, idx: best.i };
}
async function animAttack(B, side, mv) {
  const o = B.S[side], dir = side === 'me' ? 1 : -1;
  await tween(o, 'x', 12 * dir, 90); await tween(o, 'x', 0, 120);
  const [tx, ty] = POS[side === 'me' ? 'foe' : 'me']; spawnFX(mv.t, tx, ty); if (TYPE_SFX[mv.t]) SND.sfx(TYPE_SFX[mv.t]);
  await wait(420);
}
async function hitTarget(B, os, r) {
  const o = B.S[os], m = mon(B, os);
  SND.sfx(r.eff > 1 ? 'superhit' : r.eff < 1 ? 'weakhit' : 'hit');
  for (let i = 0; i < 3; i++) { o.vis = false; await wait(60); o.vis = true; await wait(60); }
  const f = m.hp; m.hp = Math.max(0, m.hp - r.dmg); await hudHP(os, m, f, m.hp);
}
async function inflict(B, side, s, verbose) {
  const m = mon(B, side), code = ST_CODE[s], nm = label(B, side);
  if (m.hp <= 0) return;
  if (m.status || SP[m.sp].types.includes(IMMUNE[code])) { if (verbose) await say(m.status ? `${nm} est déjà affecté par un statut.` : `Ça n'affecte pas ${nm}…`, { auto: 500 }); return; }
  m.status = code; if (code === 'som') m.sleep = randInt(1, 3);
  const [x, y] = POS[side]; spawnFX({ brul: 'Feu', para: 'Foudre', pois: 'Poison', som: 'Psy', gel: 'Glace' }[code], x, y); SND.sfx('status'); hudSet(side, m);
  await say({ brul: `${nm} est brûlé !`, para: `${nm} est paralysé ! Il aura du mal à attaquer.`, pois: `${nm} est empoisonné !`, som: `${nm} s'endort !`, gel: `${nm} est gelé !` }[code], { auto: 500 });
}
async function stages(B, side, ch) {
  const nm = label(B, side);
  for (const k in ch) {
    const v = ch[k], cur = B.st[side][k], nv = clamp(cur + v, -6, 6);
    if (nv === cur) { await say(`${STAGE_NAMES[k]} de ${nm} ne peut plus ${v > 0 ? 'monter' : 'baisser'} !`, { auto: 500 }); continue; }
    B.st[side][k] = nv; SND.sfx(v > 0 ? 'up' : 'down'); spawnStat(side, v > 0);
    await say(`${STAGE_NAMES[k]} de ${nm} ${v > 0 ? (v > 1 ? 'augmente beaucoup' : 'augmente') : (v < -1 ? 'baisse beaucoup' : 'baisse')} !`, { auto: 500 });
  }
}
async function useMove(B, side, id, idx) {
  const atk = mon(B, side), os = side === 'me' ? 'foe' : 'me', def = mon(B, os), an = label(B, side), dn = label(B, os);
  if (atk.status === 'som') { if (atk.sleep > 0) { atk.sleep--; await say(`${an} dort profondément.`, { auto: 500 }); return; } atk.status = null; hudSet(side, atk); await say(`${an} se réveille !`, { auto: 500 }); }
  if (atk.status === 'gel') { if (Math.random() < .2) { atk.status = null; hudSet(side, atk); await say(`${an} n'est plus gelé !`, { auto: 500 }); } else { await say(`${an} est gelé ! Il ne peut pas bouger.`, { auto: 500 }); return; } }
  if (B.flinch[side]) { await say(`${an} a la trouille et n'attaque pas !`, { auto: 500 }); return; }
  if (atk.status === 'para' && Math.random() < .25) { await say(`${an} est paralysé ! Il ne peut pas attaquer.`, { auto: 500 }); return; }
  const mv = MOVES[id], fx = mv.fx || {};
  if (idx != null && atk.moves[idx]) atk.moves[idx].pp = Math.max(0, atk.moves[idx].pp - 1);
  await say(`${an} utilise ${mv.n} !`, { auto: 250 });
  const onFoe = mv.cat !== 'stat' || fx.foe || fx.burn || fx.para || fx.poison || fx.sleep || fx.freeze;
  if (mv.a && onFoe && Math.random() * 100 >= mv.a * accMul(B.st[side].acc)) { await say(`Mais ${an} rate son attaque !`, { auto: 500 }); return; }
  if (mv.cat === 'stat') {
    if (fx.heal) { const mx = maxHP(atk); if (atk.hp >= mx) { await say(`Les PV de ${an} sont déjà au maximum !`, { auto: 500 }); return; } spawnStat(side, true); SND.sfx('heal'); const f = atk.hp; atk.hp = Math.min(mx, atk.hp + Math.floor(mx * fx.heal)); await hudHP(side, atk, f, atk.hp); await say(`${an} récupère des PV !`, { auto: 500 }); return; }
    if (fx.self) { await stages(B, side, fx.self); return; }
    if (fx.foe) { await stages(B, os, fx.foe); return; }
    for (const s of ['burn', 'para', 'poison', 'sleep', 'freeze']) if (fx[s]) { await inflict(B, os, s, true); return; }
    return;
  }
  await animAttack(B, side, mv);
  const r = calcDamage(atk, def, mv, B.st[side], B.st[os]);
  if (r.eff === 0) { await say(`Ça n'affecte pas ${dn}…`, { auto: 600 }); return; }
  await hitTarget(B, os, r);
  if (r.crit) await say('Coup critique !', { auto: 400 });
  if (r.eff > 1) await say("C'est super efficace !", { auto: 500 }); else if (r.eff < 1) await say("Ce n'est pas très efficace…", { auto: 500 });
  if (fx.drain && atk.hp > 0) { const h = Math.max(1, Math.floor(r.dmg * fx.drain)), f = atk.hp; atk.hp = Math.min(maxHP(atk), atk.hp + h); await hudHP(side, atk, f, atk.hp); await say(`L'énergie de ${dn} est drainée !`, { auto: 400 }); }
  if (fx.recoil) { const rc = Math.max(1, Math.floor(r.dmg * fx.recoil)), f = atk.hp; atk.hp = Math.max(0, atk.hp - rc); await hudHP(side, atk, f, atk.hp); await say(`${an} se blesse en frappant !`, { auto: 400 }); }
  if (def.hp > 0) {
    for (const s of ['burn', 'para', 'poison', 'sleep', 'freeze']) if (fx[s] && Math.random() < fx[s]) await inflict(B, os, s, false);
    if (fx.flinch && Math.random() < fx.flinch) B.flinch[os] = true;
    if (fx.foe && Math.random() < (fx.chance == null ? 1 : fx.chance)) await stages(B, os, fx.foe);
    if (mv.t === 'Feu' && def.status === 'gel') { def.status = null; hudSet(os, def); await say(`${dn} n'est plus gelé !`, { auto: 400 }); }
  }
  if (fx.self && atk.hp > 0) await stages(B, side, fx.self);
}
async function faintAnim(B, side) { const o = B.S[side]; SND.sfx('faint'); await Promise.all([tween(o, 'y', 40, 420, t => t * t), tween(o, 'alpha', 0, 420)]); o.vis = false; o.y = 0; o.alpha = 1; }
async function sendFoe(B) {
  const f = foeMon(B), S = B.S; markSeen(f.sp); setSprites(B);

  await tween(S.foe, 'scale', 1, 260); S.foe.white = false; hudSet('foe', f); await wait(200);
}
async function sendMe(B) {
  const m = meMon(B), S = B.S; B.part.add(m.uid); setSprites(B);
  await say(`En avant, ${monName(m)} !`, { auto: 200 });

async function switchMe(B, i) {
  const o = meMon(B), S = B.S;
  await say(`${monName(o)}, reviens !`, { auto: 250 }); S.me.white = true; await tween(S.me, 'scale', 0, 220); S.me.vis = false; S.me.white = false; hudHide('me');
  B.mi = i; B.st.me = stg(); await sendMe(B);

async function giveXP(B, m, gain) {
  const active = m === meMon(B); let left = gain;
  while (left > 0 && m.lvl < 100) {
    const next = xpFor(m.lvl + 1), add = Math.min(next - m.xp, left), from = m.xp;
    m.xp += add; left -= add;
    if (active) await anim(Math.min(700, 150 + add / Math.max(1, next - xpFor(m.lvl)) * 600), p => hudXP(m, Math.round(from + add * p)));
    if (m.xp >= next) {
      const oldMax = maxHP(m); m.lvl++; if (m.hp > 0) m.hp = Math.min(maxHP(m), m.hp + maxHP(m) - oldMax);
      if (active) hudSet('me', m);
      SND.overlay('levelup');
      await say(`${monName(m)} monte au niveau ${m.lvl} !`, { auto: 700 });
      for (const [l, id] of learnset(m.sp)) if (l === m.lvl) { await learnMove(m, id); hideDlg(); }
      if (SP[m.sp].evo && m.lvl >= SP[m.sp].evo[0]) B.evo.add(m.uid);
    }
  }
}
async function handleFaints(B) {
  let ended = false;
  const foe = foeMon(B);
  if (foe.hp <= 0) {
    ended = true;
    await faintAnim(B, 'foe'); await say(`${label(B, 'foe')} est K.O. !`, { auto: 500 }); hudHide('foe');
    const last = B.wild || B.fi >= B.foeTeam.length - 1;
    if (last) SND.play('victory');
    const gain = Math.max(1, Math.floor(SP[foe.sp].xp * foe.lvl / 7 * (B.trainer ? 1.5 : 1) * 1.6));
    for (const uid of [...B.part]) { const m = G.party.find(p => p.uid === uid); if (!m || m.hp <= 0) continue; await say(`${monName(m)} gagne ${fmt(gain)} points d'expérience !`, { auto: 450 }); await giveXP(B, m, gain); }
    const me = meMon(B); B.part = new Set(me && me.hp > 0 ? [me.uid] : []);
    if (last) { B.over = 'win'; return true; }
    B.fi++; B.st.foe = stg();
    if (meMon(B).hp > 0) { await sendFoe(B); return true; }
  }
  const me = meMon(B);
  if (me.hp <= 0) {
    ended = true;
    if (B.S.me.vis) { await faintAnim(B, 'me'); await say(`${monName(me)} est K.O. !`, { auto: 500 }); hudHide('me'); }
    if (!G.party.some(m => m.hp > 0)) { B.over = 'lose'; return true; }
    hideDlg();
    const i = await partyScreen({ mode: 'forced' }); B.mi = i; B.st.me = stg(); await sendMe(B);
    if (!B.S.foe.vis && foeMon(B).hp > 0) await sendFoe(B);
  }
  return ended;
}
function canEscape(B) { const a = stat(meMon(B), 'spd'), b = stat(foeMon(B), 'spd'); if (a >= b) return true; return Math.random() < (a * 32 / Math.max(1, b) + 30 * B.runs) / 256 + .25; }
async function throwCapsule(B, id) {
  const it = ITEMS[id], S = B.S;
  await say(`${G.name} lance une ${it.n} !`, { auto: 150 });
  const ball = { x: 40, y: 100, rot: 0 }; S.ball = ball; SND.sfx('throw');
  await anim(520, p => { ball.x = 40 + (176 - 40) * p; ball.y = 100 + (36 - 100) * p - Math.sin(p * Math.PI) * 40; ball.rot = p * 12; });
  if (B.trainer) { SND.sfx('weakhit'); await anim(300, p => { ball.x = 176 + p * 50; ball.y = 36 + p * 70; }); S.ball = null; await say("Le dresseur dévie la Capsule ! Voler, c'est mal !"); return; }
  SND.sfx('pop'); S.foe.white = true; await tween(S.foe, 'scale', 0, 240); S.foe.vis = false; S.foe.white = false;
  await anim(260, p => { ball.y = 36 + p * 28; ball.rot = 0; });
  const foe = foeMon(B), mx = maxHP(foe);
  let a = ((3 * mx - 2 * foe.hp) * SP[foe.sp].cr * it.ball) / (3 * mx);
  if (foe.status === 'som' || foe.status === 'gel') a *= 2; else if (foe.status) a *= 1.5;
  let shakes = 0, caught = false;
  if (a >= 255) { shakes = 3; caught = true; } else { const b = 65536 / Math.pow(255 / a, .1875); for (let i = 0; i < 4; i++) { if (Math.random() * 65536 < b) shakes++; else break; } caught = shakes === 4; shakes = Math.min(3, shakes); }
  for (let i = 0; i < shakes; i++) { await wait(380); SND.sfx('shake'); await anim(280, p => { ball.rot = Math.sin(p * Math.PI * 2) * .55; }); ball.rot = 0; }
  await wait(350);
  if (caught) {
    for (let i = 0; i < 6; i++) FX.push({ x: ball.x, y: ball.y, vx: Math.cos(i) * 40, vy: -30 - i * 6, g: 60, life: .7, age: 0, sz: 2, col: '#ffe27a' });
    SND.jingle('caught');
    await say(`Super ! ${monName(foe)} est capturé !`);
    if (!G.caught.includes(foe.sp)) { G.caught.push(foe.sp); markSeen(foe.sp); await say(`Les données de ${monName(foe)} sont ajoutées au Codex !`); }
    if (G.party.length < 6) G.party.push(foe); else { G.box.push(foe); await say(`Ton équipe est complète : ${monName(foe)} est envoyé dans la Boîte du PC.`); }
    B.over = 'caught'; return;
  }
  S.ball = null; SND.sfx('pop'); S.foe.vis = true; S.foe.white = true; S.foe.scale = 0; await tween(S.foe, 'scale', 1, 220); S.foe.white = false;
  await say(["Oh non ! La créature s'est libérée !", "Raah ! Ça y était presque !", "Mince ! Encore un tout petit peu !", "Argh ! Si près du but !"][shakes], { auto: 600 });
}
async function useItemBattle(B, act) {
  const it = ITEMS[act.item]; G.bag[act.item]--;
  if (it.ball) { await throwCapsule(B, act.item); return; }
  const m = G.party[act.target], f = m.hp, msg = applyItem(act.item, m);
  await say(`${G.name} utilise ${it.n} !`, { auto: 250 }); SND.sfx('heal');
  if (act.target === B.mi) { spawnStat('me', true); await hudHP('me', m, f, m.hp); hudSet('me', m); }
  await say(msg, { auto: 500 });
}
async function foePotion(B) {
  const m = foeMon(B); B.potions--;
  await say(`${B.trainer.name} utilise une Hyper Potion !`, { auto: 300 }); SND.sfx('heal'); spawnStat('foe', true);
  const f = m.hp; m.hp = Math.min(maxHP(m), m.hp + Math.max(60, Math.floor(maxHP(m) * .5))); await hudHP('foe', m, f, m.hp);
}
async function endOfTurn(B) {
  for (const side of ['me', 'foe']) {
    const m = mon(B, side); if (!m || m.hp <= 0 || (m.status !== 'brul' && m.status !== 'pois')) continue;
    const dmg = Math.max(1, Math.floor(maxHP(m) / (m.status === 'brul' ? 16 : 8))), [x, y] = POS[side];
    spawnFX(m.status === 'brul' ? 'Feu' : 'Poison', x, y); const f = m.hp; m.hp = Math.max(0, m.hp - dmg); await hudHP(side, m, f, m.hp);
    await say(`${label(B, side)} souffre ${m.status === 'brul' ? 'de sa brûlure' : 'du poison'} !`, { auto: 500 });
  }
  await handleFaints(B);
}
async function doTurn(B, act) {
  B.flinch = { me: false, foe: false };
  if (act.k === 'run') {
    if (B.trainer) { await say("Impossible de fuir un combat contre un dresseur !"); return; }
    B.runs++; if (canEscape(B)) { SND.sfx('run'); await say('Tu prends la fuite !', { auto: 400 }); B.over = 'run'; return; }
    await say("Impossible de s'enfuir !", { auto: 500 });
  } else if (act.k === 'switch') await switchMe(B, act.i);
  else if (act.k === 'item') { await useItemBattle(B, act); if (B.over) return; }
  const fa = aiChoose(B);
  if (fa.k === 'potion') await foePotion(B);
  const actors = [];
  if (act.k === 'move') actors.push('me');
  if (fa.k === 'move') actors.push('foe');
  if (actors.length === 2) {
    const pm = (MOVES[act.id].fx || {}).prio || 0, pf = (MOVES[fa.id].fx || {}).prio || 0;
    const meFirst = pm !== pf ? pm > pf : (speedOf(B, 'me') === speedOf(B, 'foe') ? Math.random() < .5 : speedOf(B, 'me') > speedOf(B, 'foe'));
    if (!meFirst) actors.reverse();
  }
  for (const side of actors) {
    if (B.over) return;
    const a = mon(B, side), d = mon(B, side === 'me' ? 'foe' : 'me');
    if (a.hp <= 0 || d.hp <= 0) continue;
    if (side === 'me') await useMove(B, 'me', act.id, act.idx); else await useMove(B, 'foe', fa.id, fa.idx);
    if (await handleFaints(B)) return;
  }
  await endOfTurn(B);
}

/* ---------- Déroulement ---------- */
async function battle(cfg) {
  const B = { cfg, wild: !!cfg.wild, trainer: cfg.trainer || null, fi: 0, mi: G.party.findIndex(m => m.hp > 0), st: { me: stg(), foe: stg() }, part: new Set(), runs: 0, over: null, flinch: { me: false, foe: false }, evo: new Set(), potions: cfg.trainer ? cfg.trainer.potions : 0, idle: false };
  B.foeTeam = cfg.wild ? [cfg.wild] : cfg.trainer.team.map(([s, l]) => makeMon(s, l));
  B.S = { foe: mkSO(), me: mkSO(), foeTr: mkSO(), meTr: mkSO(), ball: null };
  hideDlg(); Input.clear();
  SND.play((cfg.trainer && cfg.trainer.music) || ((cfg.trainer && cfg.trainer.leader) || cfg.legend ? 'leader' : 'battle'));
  await flash(3); await fade(1, 220);
  BATTLE = B; B.bg = paintBattleBG(); FX.length = 0; hudInit(); MODE = 'battle';
  const S = B.S;
  S.meTr.img = trainerArt(PLAYER_LOOK, true); S.meTr.vis = true; S.meTr.x = 200;
  if (B.wild) { markSeen(cfg.wild.sp); setSprites(B); S.foe.vis = true; S.foe.x = -200; }
  else { S.foeTr.img = trainerArt(B.trainer.look, false); S.foeTr.vis = true; S.foeTr.x = -200; }
  await fade(0, 220);
  await Promise.all([tween(B.wild ? S.foe : S.foeTr, 'x', 0, 700), tween(S.meTr, 'x', 0, 700)]);
  if (B.wild) { hudSet('foe', cfg.wild); await say(cfg.legend ? `${monName(cfg.wild)} apparaît !` : `Un ${monName(cfg.wild)} sauvage apparaît !`, { auto: 500 }); }
  else { await say(`${B.trainer.title} veut se battre !`, { auto: 500 }); await tween(S.foeTr, 'x', 150, 320); S.foeTr.vis = false; S.foeTr.x = 0; await sendFoe(B); }
  await tween(S.meTr, 'x', -150, 320); S.meTr.vis = false; S.meTr.x = 0;
  await sendMe(B);
  while (!B.over) { const act = await playerAction(B); await doTurn(B, act); }
  if (B.over === 'win' && B.trainer) {
    S.foeTr.vis = true; S.foeTr.x = 120; await tween(S.foeTr, 'x', 0, 400);
    await say(`Tu as battu ${B.trainer.title} !`);
    await say(`${B.trainer.name} : ${B.trainer.win}`);
    G.money += B.trainer.prize; SND.sfx('buy'); await say(`Tu gagnes ${fmt(B.trainer.prize)} écus !`);
  }
  hideDlg(); await fade(1, 300);
  MODE = 'world'; BATTLE = null; FX.length = 0; $('#hud').innerHTML = '';
  G.party.forEach(m => { if (m.status === 'som' && m.sleep <= 0) m.status = null; });
  SND.play(MAP.music);
  await fade(0, 300);
  if (B.over !== 'lose') for (const uid of B.evo) { const m = G.party.find(p => p.uid === uid); if (m && m.hp > 0 && SP[m.sp].evo && m.lvl >= SP[m.sp].evo[0]) await evolve(m); }
  return B.over;
}
/* =====================================================================
   DÉMARRAGE — écran titre, introduction, sauvegarde, boucle

const cv = $('#cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const SAVE_KEY = 'valmyr-sauvegarde-v1', SET_KEY = 'valmyr-reglages';
let SCENE = null;

function newState(name) {
  return { v: 2, name, rival: 'Silas', starterSp: null, rivalSp: null, money: 3000, badges: [false, false, false, false, false, false, false, false], party: [], box: [], bag: { potion: 1 }, seen: [], caught: [], map: 't0:home', x: 2, y: 4, dir: 0, ret: { map: 't0', x: 6, y: 7 }, flags: {}, lastHeal: { map: 't0', x: 6, y: 7 }, repel: 0, time: 0, champion: false, uid: 1 };
}
function serialize() { G.uid = UID; if (MAP && MODE === 'world') { G.map = MAP.id; G.x = P.x; G.y = P.y; G.dir = P.dir; } return JSON.stringify(G); }
function save() { if (!G) return false; try { localStorage.setItem(SAVE_KEY, serialize()); return true; } catch (e) { return false; } }
function loadSaveRaw() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function saveSettings() { try { localStorage.setItem(SET_KEY, JSON.stringify(SET)); } catch (e) { } }
function loadSettings() { try { const s = JSON.parse(localStorage.getItem(SET_KEY) || 'null'); if (s) Object.assign(SET, s); } catch (e) { } SND.setMusic(SET.music); applyPad(); }
function applyPad() { const a = $('#app'); if (a) a.dataset.pad = SET.pad === 'dpad' ? 'dpad' : 'joy'; }
function resetMaps() { for (const k in MAPS) delete MAPS[k]; }
function startFromSave(s) {
  resetMaps();
  G = Object.assign(newState(s.name), s);
  if (!s.v || s.v < 2) {
    // Partie commencée avant l'arrivée du labo et du rival
    const first = G.caught.find(id => STARTERS.includes(id)) || (G.party[0] && Object.keys(STARTER_LINES).find(k => STARTER_LINES[k].includes(G.party[0].sp))) || 'gouttin';
    G.starterSp = G.starterSp || first; G.rivalSp = G.rivalSp || COUNTER[G.starterSp];
    if (G.party.length) { G.flags.starter = 1; G.flags.labDone = 1; }

/* ---------- Scènes peintes ---------- */
function renderTitle(now) {
  const t = now / 1000, W = LW, H = LH, hz = Math.round(H * .62);
  const bands = ['#191c3e', '#22265a', '#2e2f6e', '#463a80', '#6a4688', '#9a5a86', '#d07a7a', '#f2a46a'];
  const bh = Math.ceil(hz / bands.length);
  bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, i * bh, W, bh + 1); });
  ctx.fillStyle = bands[bands.length - 1]; ctx.fillRect(0, bh * bands.length, W, H);
  for (let i = 0; i < Math.round(W * hz / 900); i++) { const x = (i * 97) % W, y = (i * 53) % Math.max(20, hz * .6); if ((Math.floor(t * 2 + i) % 5) !== 0) { ctx.fillStyle = i % 7 ? '#c8c8f0' : '#ffe27a'; ctx.fillRect(x, y, 1, 1); } }
  disc(ctx, W * .78, hz - 8, 14, '#ffd27a'); disc(ctx, W * .78, hz - 8, 11, '#ffe9b8');
  const hills = [['#3a2f62', hz + 8, 20, 31], ['#2a2852', hz + 20, 14, 17], ['#1c1f40', hz + 34, 10, 11]];
  hills.forEach(([c, base, amp, per], k) => { ctx.fillStyle = c; for (let x = 0; x < W; x++) { const h = Math.round(amp * (.6 + .4 * Math.sin((x + t * (4 + k * 6)) / per) + .25 * Math.sin((x * 2.3 + k * 40) / per))); ctx.fillRect(x, base - h, 1, H); } });
  ctx.fillStyle = '#14172e'; ctx.fillRect(0, H - 32, W, 32);
  const cx = Math.round(W / 2);
  STARTERS.forEach((id, i) => { const bob = Math.floor((t * 2 + i * .7) % 2), x = cx - 104 + i * 72; ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x + 16, H - 31, 32, 3); ctx.drawImage(getSprite(id), 0, 0, 64, 64, x, H - 92 - bob, 64, 64); });
}
function renderScene(now) {
  for (let y = 0; y < LH; y += 8) { ctx.fillStyle = (y / 8) % 2 ? '#dfe4f6' : '#e8ecfa'; ctx.fillRect(0, y, LW, 8); }
  const cx = Math.round(LW / 2), cy = Math.round(LH / 2) - 20;
  oval(ctx, cx, cy + 52, 70, 12, '#c8d0ee');
  if (!SCENE) return;
  const showMon = !!SCENE.mon, showRival = !!SCENE.rival;
  const px = showMon || showRival ? cx - 72 : cx - 32;
  ctx.drawImage(trainerArt(LOOKS.prof, false), px, cy - 12);
  if (showRival) ctx.drawImage(trainerArt(LOOKS.rival, false), cx + 8, cy - 12);
  else if (showMon) { const bob = Math.floor(now / 400) % 2; ctx.drawImage(getSprite(SCENE.mon), 0, 0, 64, 64, cx + 8, cy - 4 - bob, 64, 64); }
}

/* ---------- Écran titre ---------- */
async function titleScreen() {
  MODE = 'title'; hideDlg(); await fade(0, 400);
  const t = el('div', 'title', `<div class="logo"><small>Créatures de</small><h1>VALMYR</h1></div><p class="press">Appuie sur A</p><div class="tmenu box" hidden></div><p class="khint">Clavier : flèches pour bouger · Espace = A · Échap = B (maintenu : courir) · M = Menu</p>`);
  UI.root.appendChild(t);
  await new Promise(res => { const h = { key(k) { if (k === 'a' || k === 'start') { Input.pop(h); res(); } } }; Input.push(h); t.addEventListener('pointerdown', () => Input.press('a'), { once: true }); });

    const sv = loadSaveRaw(), opts = [];
    if (sv) { const nb = sv.badges.filter(Boolean).length; opts.push({ k: 'c', h: `Continuer<small>${esc(sv.name)} · ${nb} badge${nb > 1 ? 's' : ''} · ${sv.caught.length} au Codex</small>` }); }

    mbox.innerHTML = opts.map(o => `<div class="it">${o.h}</div>`).join('');
    const i = await navigate(mbox, { cancel: false }), o = opts[i];
    if (o.k === 'c') { await fade(1, 300); t.remove(); startFromSave(sv); return; }
    if (o.k === 'n') {
      if (sv) { mbox.hidden = true; const c = await ask('Une partie existe déjà. Commencer une nouvelle aventure effacera l’ancienne.', ['Garder ma partie', 'Recommencer']); hideDlg(); mbox.hidden = false; if (c !== 1) continue; }
      await fade(1, 300); t.remove(); return newGameIntro();
    }
    if (o.k === 'q') { await fade(1, 250); location.href = 'index.html#/coin/jeux'; return; }
    if (o.k === 'o') { mbox.hidden = true; await optionsMenu(); hideDlg(); mbox.hidden = false; }

}
function askName(label, ph) {
  return new Promise(res => {
    const p = el('div', 'namebox box', `<label for="nm-in">${esc(label)}</label><input id="nm-in" maxlength="10" autocomplete="off" spellcheck="false" placeholder="${esc(ph)}"><button class="btn" id="nm-ok">Valider</button>`);
    UI.root.appendChild(p); const inp = p.querySelector('input'); setTimeout(() => inp.focus(), 60);
    const h = { key(k) { if (k === 'a') ok(); } }; Input.push(h);
    function ok() { const v = (inp.value.trim().replace(/[<>]/g, '') || ph).slice(0, 10); Input.pop(h); p.remove(); SND.sfx('select'); res(v); }

}
async function newGameIntro() {

  MODE = 'scene'; SCENE = {}; SND.play('town'); await fade(0, 400);
  await say("Bonjour ! Bienvenue dans le monde des créatures !");

/* ---------- Mise en page plein écran ---------- */
function layout() {
  const app = $('#app'), W = app.clientWidth, H = app.clientHeight; if (!W || !H) return;
  const coarse = matchMedia('(pointer: coarse)').matches || (navigator.maxTouchPoints > 0 && !matchMedia('(hover: hover)').matches);
  const mode = !coarse ? 'desk' : (H >= W ? 'port' : 'land');
  app.dataset.mode = mode;
  const ctrlH = mode === 'port' ? Math.round(clamp(H * .3, 190, 260)) : 0;
  const sw = W, sh = H - ctrlH, s = Math.min(sw / 240, sh / 160);
  const nw = Math.max(240, Math.round(sw / s)), nh = Math.max(160, Math.round(sh / s));
  if (cv.width !== nw || cv.height !== nh) { LW = nw; LH = nh; cv.width = nw; cv.height = nh; ctx.imageSmoothingEnabled = false; }
  const scr = $('#screen'); scr.style.height = sh + 'px';
  const uw = 240 * s, ux = (sw - uw) / 2;
  const ui = $('#ui'); ui.style.left = ux + 'px'; ui.style.width = uw + 'px'; ui.style.fontSize = (uw * .042).toFixed(2) + 'px';
  const st = $('#stage'); st.style.left = ux + 'px'; st.style.width = uw + 'px'; st.style.height = (160 * s) + 'px'; st.style.top = (sh - 160 * s) + 'px';
  const ctrl = $('#controls'); ctrl.style.height = ctrlH ? ctrlH + 'px' : '';
  app.style.setProperty('--cs', mode === 'land' ? clamp((ux - 14) / 140, .62, 1).toFixed(3) : '1');
}

/* ---------- Boucle ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last); last = now;
  try {
    updateTweens(now);
    if (G && (MODE === 'world' || MODE === 'battle')) G.time += dt / 1000;
    if (MODE === 'world' && MAP) { updateWorld(dt, now); renderWorld(now); }
    else if (MODE === 'battle') { updateFX(dt); renderBattle(now); }
    else if (MODE === 'title') renderTitle(now);
    else if (MODE === 'scene') renderScene(now);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
function boot(data) {
  UI.root = $('#ui'); bindControls(); layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 200));
  document.addEventListener('fullscreenchange', () => setTimeout(layout, 50));
  loadSettings();
  requestAnimationFrame(frame);
  const hotSave = data && data.save;
  if (hotSave) { try { startFromSave(JSON.parse(hotSave)); return; } catch (e) { } }
  titleScreen();
}
const HOT = window.claude && window.claude.hot;
if (HOT && typeof HOT.snapshot === 'function') { try { HOT.snapshot(() => ({ save: G && MODE === 'world' ? serialize() : null })); } catch (e) { } }
if (HOT && typeof HOT.ready === 'function') HOT.ready(boot); else boot((HOT && HOT.data) || {});
